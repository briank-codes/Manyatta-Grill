<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unauthorized – Manyatta Grill</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Lato',sans-serif;background:#1A1208;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .box{text-align:center;max-width:440px}
    .icon{font-size:4rem;margin-bottom:1.5rem}
    h1{font-family:'Playfair Display',serif;color:#fff;font-size:2.2rem;margin-bottom:.75rem}
    p{color:#9A8D7E;line-height:1.7;margin-bottom:2rem}
    .btn{display:inline-block;padding:.8rem 1.8rem;background:#D94F2B;color:#fff;border-radius:8px;font-weight:700;text-decoration:none;margin:.3rem;transition:background .2s}
    .btn:hover{background:#B33A1A}
    .btn-ghost{background:transparent;border:1.5px solid #5A4E3E;color:#9A8D7E}
    .btn-ghost:hover{background:rgba(255,255,255,.05);color:#fff}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🔒</div>
    <h1>Access Denied</h1>
    <p>You don't have permission to view this page. Please contact an administrator if you believe this is a mistake.</p>
    <a href="dashboard.html" class="btn">Go to Dashboard</a>
    <a href="index.html" class="btn btn-ghost">Back to Site</a>
  </div>
  <script src="auth.js"></script>
</body>
</html>
